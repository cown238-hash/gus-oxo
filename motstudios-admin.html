<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTSTUDIOS - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .admin-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .admin-header h1 span {
            color: #DC2626;
        }

        .admin-header p {
            color: #a0a0b0;
        }

        .admin-card {
            background: #1a1a25;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .admin-card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-card h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #DC2626, #7F1D1D);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #a0a0b0;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: #12121a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #DC2626;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #DC2626, #7F1D1D);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #a0a0b0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-secondary:hover {
            border-color: #DC2626;
            color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .preview-section {
            background: #12121a;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .preview-section h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #a0a0b0;
        }

        .preview-content {
            background: #0a0a0f;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #a0a0b0;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            background: #1a1a25;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #a0a0b0;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tab-btn:hover,
        .tab-btn.active {
            background: linear-gradient(135deg, #DC2626, #7F1D1D);
            color: white;
            border-color: transparent;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .array-editor {
            background: #12121a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .array-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .array-item input {
            flex: 1;
        }

        .array-item .btn-small {
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .add-btn {
            background: rgba(220, 38, 38, 0.1);
            border: 1px dashed rgba(220, 38, 38, 0.3);
            color: #DC2626;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            background: rgba(220, 38, 38, 0.2);
        }

        .remove-btn {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .tabs {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>MOT<span>STUDIOS</span> Admin</h1>
            <p>แก้ไขเนื้อหาเว็บไซต์ของคุณ</p>
        </div>

        <div class="success-message" id="successMessage">
            บันทึกข้อมูลเรียบร้อยแล้ว!
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="general">ข้อมูลทั่วไป</button>
            <button class="tab-btn" data-tab="stats">สถิติ</button>
            <button class="tab-btn" data-tab="works">ผลงาน</button>
            <button class="tab-btn" data-tab="services">บริการ</button>
            <button class="tab-btn" data-tab="contact">ติดต่อ</button>
            <button class="tab-btn" data-tab="about">เกี่ยวกับ</button>
        </div>

        <!-- General Tab -->
        <div class="tab-content active" id="general">
            <div class="admin-card">
                <h2>ข้อมูลทั่วไป</h2>
                <div class="form-group">
                    <label>ชื่อแบรนด์</label>
                    <input type="text" id="brandName" value="MOTSTUDIOS">
                </div>
                <div class="form-group">
                    <label>สโลแกน</label>
                    <input type="text" id="brandTagline" value="Creative Studio">
                </div>
                <div class="form-group">
                    <label>คำอธิบาย</label>
                    <textarea id="brandDescription">MOTSTUDIOS is a creative studio specializing in music production, visual design, and digital experiences that leave lasting impressions.</textarea>
                </div>
            </div>
        </div>

        <!-- Stats Tab -->
        <div class="tab-content" id="stats">
            <div class="admin-card">
                <h2>สถิติ</h2>
                <div id="statsEditor">
                    <div class="array-editor">
                        <div class="array-item">
                            <input type="number" class="stat-value" value="200" placeholder="ค่า">
                            <input type="text" class="stat-label" value="Projects Done" placeholder="ป้ายกำกับ">
                        </div>
                        <div class="array-item">
                            <input type="number" class="stat-value" value="50" placeholder="ค่า">
                            <input type="text" class="stat-label" value="Happy Clients" placeholder="ป้ายกำกับ">
                        </div>
                        <div class="array-item">
                            <input type="number" class="stat-value" value="5" placeholder="ค่า">
                            <input type="text" class="stat-label" value="Years Experience" placeholder="ป้ายกำกับ">
                        </div>
                    </div>
                </div>
                <button class="add-btn" onclick="addStat()">+ เพิ่มสถิติ</button>
            </div>
        </div>

        <!-- Works Tab -->
        <div class="tab-content" id="works">
            <div class="admin-card">
                <h2>ผลงาน</h2>
                <div id="worksEditor">
                    <div class="array-editor">
                        <div class="form-group">
                            <label>หมวดหมู่</label>
                            <input type="text" class="work-category" value="Music Production">
                        </div>
                        <div class="form-group">
                            <label>ชื่อผลงาน</label>
                            <input type="text" class="work-title" value="Album Production">
                        </div>
                    </div>
                    <div class="array-editor">
                        <div class="form-group">
                            <label>หมวดหมู่</label>
                            <input type="text" class="work-category" value="Visual Design">
                        </div>
                        <div class="form-group">
                            <label>ชื่อผลงาน</label>
                            <input type="text" class="work-title" value="Brand Identity">
                        </div>
                    </div>
                    <div class="array-editor">
                        <div class="form-group">
                            <label>หมวดหมู่</label>
                            <input type="text" class="work-category" value="Video Production">
                        </div>
                        <div class="form-group">
                            <label>ชื่อผลงาน</label>
                            <input type="text" class="work-title" value="Music Video">
                        </div>
                    </div>
                    <div class="array-editor">
                        <div class="form-group">
                            <label>หมวดหมู่</label>
                            <input type="text" class="work-category" value="Sound Design">
                        </div>
                        <div class="form-group">
                            <label>ชื่อผลงาน</label>
                            <input type="text" class="work-title" value="Audio Experience">
                        </div>
                    </div>
                </div>
                <button class="add-btn" onclick="addWork()">+ เพิ่มผลงาน</button>
            </div>
        </div>

        <!-- Services Tab -->
        <div class="tab-content" id="services">
            <div class="admin-card">
                <h2>บริการ</h2>
                <div id="servicesEditor">
                    <div class="array-editor">
                        <div class="form-group">
                            <label>ชื่อบริการ</label>
                            <input type="text" class="service-title" value="Music Production">
                        </div>
                        <div class="form-group">
                            <label>คำอธิบาย</label>
                            <textarea class="service-desc">Professional beat making, composition, and production for artists and brands.</textarea>
                        </div>
                        <div class="form-group">
                            <label>ฟีเจอร์ (คั่นด้วยจุลภาค)</label>
                            <input type="text" class="service-features" value="Custom Beats, Arrangement, Sound Design">
                        </div>
                    </div>
                    <div class="array-editor">
                        <div class="form-group">
                            <label>ชื่อบริการ</label>
                            <input type="text" class="service-title" value="Mixing & Mastering">
                        </div>
                        <div class="form-group">
                            <label>คำอธิบาย</label>
                            <textarea class="service-desc">Studio-quality mixing and mastering to make your tracks sound professional.</textarea>
                        </div>
                        <div class="form-group">
                            <label>ฟีเจอร์ (คั่นด้วยจุลภาค)</label>
                            <input type="text" class="service-features" value="Studio Quality, All Platforms, Fast Delivery">
                        </div>
                    </div>
                    <div class="array-editor">
                        <div class="form-group">
                            <label>ชื่อบริการ</label>
                            <input type="text" class="service-title" value="Visual Design">
                        </div>
                        <div class="form-group">
                            <label>คำอธิบาย</label>
                            <textarea class="service-desc">Album covers, branding, and visual content that stands out.</textarea>
                        </div>
                        <div class="form-group">
                            <label>ฟีเจอร์ (คั่นด้วยจุลภาค)</label>
                            <input type="text" class="service-features" value="Album Covers, Brand Identity, Social Media">
                        </div>
                    </div>
                    <div class="array-editor">
                        <div class="form-group">
                            <label>ชื่อบริการ</label>
                            <input type="text" class="service-title" value="Video Production">
                        </div>
                        <div class="form-group">
                            <label>คำอธิบาย</label>
                            <textarea class="service-desc">Music videos, promotional content, and visual storytelling.</textarea>
                        </div>
                        <div class="form-group">
                            <label>ฟีเจอร์ (คั่นด้วยจุลภาค)</label>
                            <input type="text" class="service-features" value="Music Videos, Promotional Content, Visual Effects">
                        </div>
                    </div>
                </div>
                <button class="add-btn" onclick="addService()">+ เพิ่มบริการ</button>
            </div>
        </div>

        <!-- Contact Tab -->
        <div class="tab-content" id="contact">
            <div class="admin-card">
                <h2>ข้อมูลติดต่อ</h2>
                <div class="form-group">
                    <label>อีเมล</label>
                    <input type="email" id="contactEmail" value="contact@motstudios.com">
                </div>
                <div class="form-group">
                    <label>ที่ตั้ง</label>
                    <input type="text" id="contactLocation" value="Los Angeles, CA">
                </div>
                <div class="form-group">
                    <label>เวลาตอบกลับ</label>
                    <input type="text" id="contactResponse" value="Within 24 hours">
                </div>
            </div>
        </div>

        <!-- About Tab -->
        <div class="tab-content" id="about">
            <div class="admin-card">
                <h2>เกี่ยวกับเรา</h2>
                <div class="form-group">
                    <label>หัวข้อ</label>
                    <input type="text" id="aboutTitle" value="The Team Behind MOTSTUDIOS">
                </div>
                <div class="form-group">
                    <label>ย่อหน้าที่ 1</label>
                    <textarea id="aboutPara1">MOTSTUDIOS was founded with a passion for creating exceptional content. We believe in pushing creative boundaries and delivering work that exceeds expectations.</textarea>
                </div>
                <div class="form-group">
                    <label>ย่อหน้าที่ 2</label>
                    <textarea id="aboutPara2">Our team combines technical expertise with artistic vision to produce results that resonate with audiences and elevate brands.</textarea>
                </div>
            </div>
        </div>

        <div class="admin-card">
            <h2>การจัดการข้อมูล</h2>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveConfig()">บันทึกข้อมูล</button>
                <button class="btn btn-secondary" onclick="resetConfig()">รีเซ็ตเป็นค่าเริ่มต้น</button>
                <button class="btn btn-secondary" onclick="exportConfig()">ส่งออก JSON</button>
            </div>
            <div class="preview-section">
                <h3>ตัวอย่างข้อมูล JSON</h3>
                <div class="preview-content" id="jsonPreview"></div>
            </div>
        </div>
    </div>

    <script>
        // Tab functionality
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        // Add stat
        function addStat() {
            const editor = document.getElementById('statsEditor');
            const div = document.createElement('div');
            div.className = 'array-item';
            div.innerHTML = `
                <input type="number" class="stat-value" placeholder="ค่า">
                <input type="text" class="stat-label" placeholder="ป้ายกำกับ">
                <button class="remove-btn" onclick="this.parentElement.remove()">ลบ</button>
            `;
            editor.appendChild(div);
        }

        // Add work
        function addWork() {
            const editor = document.getElementById('worksEditor');
            const div = document.createElement('div');
            div.className = 'array-editor';
            div.innerHTML = `
                <div class="form-group">
                    <label>หมวดหมู่</label>
                    <input type="text" class="work-category" placeholder="หมวดหมู่">
                </div>
                <div class="form-group">
                    <label>ชื่อผลงาน</label>
                    <input type="text" class="work-title" placeholder="ชื่อผลงาน">
                </div>
                <button class="remove-btn" onclick="this.parentElement.remove()">ลบ</button>
            `;
            editor.appendChild(div);
        }

        // Add service
        function addService() {
            const editor = document.getElementById('servicesEditor');
            const div = document.createElement('div');
            div.className = 'array-editor';
            div.innerHTML = `
                <div class="form-group">
                    <label>ชื่อบริการ</label>
                    <input type="text" class="service-title" placeholder="ชื่อบริการ">
                </div>
                <div class="form-group">
                    <label>คำอธิบาย</label>
                    <textarea class="service-desc" placeholder="คำอธิบาย"></textarea>
                </div>
                <div class="form-group">
                    <label>ฟีเจอร์ (คั่นด้วยจุลภาค)</label>
                    <input type="text" class="service-features" placeholder="ฟีเจอร์1, ฟีเจอร์2, ฟีเจอร์3">
                </div>
                <button class="remove-btn" onclick="this.parentElement.remove()">ลบ</button>
            `;
            editor.appendChild(div);
        }

        // Collect all data
        function collectData() {
            const stats = [];
            document.querySelectorAll('#statsEditor .array-item').forEach(item => {
                const value = item.querySelector('.stat-value').value;
                const label = item.querySelector('.stat-label').value;
                if (value && label) {
                    stats.push({ value: parseInt(value), label });
                }
            });

            const works = [];
            document.querySelectorAll('#worksEditor .array-editor').forEach(item => {
                const category = item.querySelector('.work-category').value;
                const title = item.querySelector('.work-title').value;
                if (category && title) {
                    works.push({ category, title, gradient: ["#DC2626", "#7F1D1D"] });
                }
            });

            const services = [];
            document.querySelectorAll('#servicesEditor .array-editor').forEach(item => {
                const title = item.querySelector('.service-title').value;
                const description = item.querySelector('.service-desc').value;
                const features = item.querySelector('.service-features').value.split(',').map(f => f.trim());
                if (title && description) {
                    services.push({ title, description, features, featured: false });
                }
            });

            return {
                brand: {
                    name: document.getElementById('brandName').value,
                    tagline: document.getElementById('brandTagline').value,
                    description: document.getElementById('brandDescription').value
                },
                stats,
                works,
                services,
                contact: {
                    email: document.getElementById('contactEmail').value,
                    location: document.getElementById('contactLocation').value,
                    responseTime: document.getElementById('contactResponse').value
                },
                about: {
                    title: document.getElementById('aboutTitle').value,
                    paragraphs: [
                        document.getElementById('aboutPara1').value,
                        document.getElementById('aboutPara2').value
                    ]
                }
            };
        }

        // Save config
        function saveConfig() {
            const data = collectData();
            localStorage.setItem('motstudios_config', JSON.stringify(data, null, 2));
            updatePreview(data);
            showSuccess();
        }

        // Reset config
        function resetConfig() {
            if (confirm('ต้องการรีเซ็ตเป็นค่าเริ่มต้น?')) {
                localStorage.removeItem('motstudios_config');
                location.reload();
            }
        }

        // Export config
        function exportConfig() {
            const data = collectData();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'motstudios-config.json';
            a.click();
        }

        // Update preview
        function updatePreview(data) {
            document.getElementById('jsonPreview').textContent = JSON.stringify(data, null, 2);
        }

        // Show success message
        function showSuccess() {
            const msg = document.getElementById('successMessage');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        // Load saved config on page load
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('motstudios_config');
            if (saved) {
                const data = JSON.parse(saved);
                // Populate form fields with saved data
                if (data.brand) {
                    document.getElementById('brandName').value = data.brand.name || 'MOTSTUDIOS';
                    document.getElementById('brandTagline').value = data.brand.tagline || 'Creative Studio';
                    document.getElementById('brandDescription').value = data.brand.description || '';
                }
                if (data.contact) {
                    document.getElementById('contactEmail').value = data.contact.email || '';
                    document.getElementById('contactLocation').value = data.contact.location || '';
                    document.getElementById('contactResponse').value = data.contact.responseTime || '';
                }
                if (data.about) {
                    document.getElementById('aboutTitle').value = data.about.title || '';
                    if (data.about.paragraphs) {
                        document.getElementById('aboutPara1').value = data.about.paragraphs[0] || '';
                        document.getElementById('aboutPara2').value = data.about.paragraphs[1] || '';
                    }
                }
                updatePreview(data);
            } else {
                updatePreview(collectData());
            }
        });
    </script>
</body>
</html>
